name: CI

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

permissions:
  contents: read

jobs:
  php:
    name: PHP checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: engelsystem_test
          MARIADB_USER: engelsystem
          MARIADB_PASSWORD: engelsystem
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      MYSQL_TYPE: mariadb
      MYSQL_HOST: 127.0.0.1
      MYSQL_DATABASE: engelsystem_test
      MYSQL_USER: engelsystem
      MYSQL_PASSWORD: engelsystem
      MAIL_DRIVER: log
      ENVIRONMENT: testing
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up PHP
        uses: shivammathur/setup-php@d52fc211a0436f8839a587b3b5b8efddab4744ea # v2
        with:
          php-version: '8.3'
          extensions: intl, mbstring, pdo_mysql, pdo_sqlite, simplexml
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2

      - name: Validate Composer files
        run: composer validate --strict

      - name: Cache Composer downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Check PHP style
        run: composer phpcs

      - name: Run static analysis
        run: composer phpstan -- --no-progress --memory-limit=1G

      - name: Migrate test database
        run: bin/migrate

      - name: Run unit and feature tests
        run: composer phpunit -- --log-junit unittests.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: phpunit-results
          path: unittests.xml
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    name: Frontend checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: yarn

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile --non-interactive

      - name: Check JavaScript and formatting
        run: yarn lint

      - name: Validate translations
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes gettext
          for file in resources/lang/*/*.po; do
            msgfmt "$file" -o /dev/null
          done

      - name: Build production assets
        run: yarn build

  ci:
    # Require this check in the main branch ruleset.
    name: CI
    if: always()
    needs: [php, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all checks to pass
        env:
          PHP_RESULT: ${{ needs.php.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
        run: |
          test "$PHP_RESULT" = success
          test "$FRONTEND_RESULT" = success

  deploy:
    name: Deploy
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
